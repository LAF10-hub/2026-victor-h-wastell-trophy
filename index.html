<html lang="en"><head><meta charset="utf-8">

<title>2026 Victor H Wastell Trophy</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f6f7;--card:#fff;--ink:#12303a;--mute:#5d7580;--line:#d9e4e7;--acc:#0b7a8c;--accink:#fff;--gold:#d9a400;--silver:#8d9aa0;--bronze:#b36a2e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1f;--card:#15262d;--ink:#e6f1f3;--mute:#8fa8b1;--line:#243a43;--acc:#2bb5c9;--accink:#06161a}}
:root[data-theme="dark"]{--bg:#0d1a1f;--card:#15262d;--ink:#e6f1f3;--mute:#8fa8b1;--line:#243a43;--acc:#2bb5c9;--accink:#06161a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:14px}
header img{width:72px;height:72px;border-radius:14px;background:#fff;flex:none}
h1{font-size:1.35rem;line-height:1.2;margin:0 0 6px}
.pill{font-size:.75rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap;display:inline-block}
.pill.on{color:var(--acc);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.tabs{display:flex;gap:6px;margin-top:14px}
.tabs button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.tabs button.act{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rank{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--line);flex:none}
.r1{background:var(--gold);color:#fff}.r2{background:var(--silver);color:#fff}.r3{background:var(--bronze);color:#fff}
.mid{flex:1;min-width:0}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:.8rem;color:var(--mute)}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.val{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
h2{font-size:1rem;margin:0 0 8px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fields .full{grid-column:1/-1}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.add{width:100%;margin-top:8px;padding:11px;border:0;border-radius:10px;background:var(--acc);color:var(--accink);font:inherit;font-weight:600;cursor:pointer}
.msg{font-size:.85rem;color:var(--mute);margin-top:6px;min-height:1.2em}
.del{border:0;background:none;color:var(--mute);cursor:pointer;font-size:1.1rem}
.empty{color:var(--mute);padding:8px 0}
</style></head>

<script>
let catches=[],scorer=false,canEdit=false,db=null;
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const cm=n=>(Math.round(n*10)/10)+' cm';
function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' hr ago';return Math.floor(s/86400)+' d ago'}
function agg(){const m=new Map();for(const c of catches){const k=c.angler.trim().toLowerCase();let a=m.get(k);if(!a){a={name:c.angler.trim(),total:0,n:0,big:0,sp:'',lc:''};m.set(k,a)}a.total+=c.length;a.n++;if(c.length>a.big){a.big=c.length;a.sp=c.species||'';a.lc=c.location||''}}return[...m.values()]}
function render(){
  const list=agg().sort((a,b)=>b.big-a.big);
  const b=$('board');b.replaceChildren();
  if(!list.length)b.append(el('div','empty','No catches yet. Be the first to log one!'));
  const top=list.length?list[0].big:1;
  list.forEach((a,i)=>{
    const v=a.big;
    const r=el('div','row');
    r.append(el('div','rank'+(i<3?' r'+(i+1):''),i+1));
    const mid=el('div','mid');mid.append(el('div','name',a.name));
    mid.append(el('div','sub',[a.sp,a.lc].filter(Boolean).join(' · ')+' · '+a.n+(a.n===1?' fish logged':' fish logged')));
    const bar=el('div','bar'),fill=document.createElement('i');fill.style.width=(top?v/top*100:0)+'%';bar.append(fill);mid.append(bar);
    r.append(mid,el('div','val',cm(v)));b.append(r);
  });
  const f=$('feed');f.replaceChildren();
  if(!catches.length)f.append(el('div','empty','Nothing logged yet.'));
  catches.slice(0,15).forEach(c=>{
    const r=el('div','row'),mid=el('div','mid');
    mid.append(el('div','name',c.angler),el('div','sub',[c.species,c.location,ago(c.ts)].filter(Boolean).join(' · ')));
    r.append(mid,el('div','val',cm(c.length)));
    if(canEdit&&db){const d=el('button','del','✕');d.title='Remove';d.onclick=async()=>{try{await db.doc('catches/'+c.id).delete()}catch(e){$('msg').textContent='Could not remove that catch.'}};r.append(d)}
    f.append(r);
  });
}
$('addBtn').onclick=async()=>{
  const angler=$('an').value.trim(),length=parseFloat($('ln').value),species=$('sp').value,location=$('lc').value,msg=$('msg');
  if(!angler||!(length>0)||length>150||!species||!location){msg.textContent='Enter a name, length (cm), species and location.';return}
  const c={angler,length:Math.round(length*10)/10,species,location,ts:Date.now()};
  $('addBtn').disabled=true;
  try{
    if(db)await db.collection('catches').add(c);else{c.id='l'+c.ts;catches.unshift(c);render()}
    $('ln').value='';msg.textContent='Logged '+cm(c.length)+' '+species+' for '+angler+'.';
  }catch(e){msg.textContent=e&&e.code==='invalid_argument'?'Only scorers can add catches.':'Could not save. Please try again.'}
  $('addBtn').disabled=false;
};
render();
setInterval(()=>{if(catches.length)render()},60000);
(async()=>{
  try{
    const user=await claude.use('user');
    if(user){canEdit=!!user.canEdit();scorer=canEdit||!!user.isOwner()}
    db=await claude.use('db');
  }catch(e){db=null}
  
  const st=$('st');
  if(!db){st.textContent='Sign in to Claude to see live standings';render();return}
  if(scorer){$('formCard').style.display='';$('feedCard').style.display=''}
  st.textContent='● Live';st.className='pill on';
  db.collection('catches').orderBy('ts','desc').limit(500).onSnapshot(
    s=>{catches=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.angler&&typeof c.length==='number');render()},
    ()=>{st.textContent='Live updates stopped';st.className='pill'}
  );
})();
</script></body></html>
